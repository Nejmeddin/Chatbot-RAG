name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The test suite stubs out the embedding model and the database, so CI
      # needs neither PyTorch nor a PostgreSQL service to run.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy "psycopg[binary]" python-dotenv pypdf \
                      langchain-text-splitters langchain-core pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest
