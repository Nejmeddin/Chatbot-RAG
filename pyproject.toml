[project]
name = "chatbot-rag"
version = "0.1.0"
description = "A Retrieval-Augmented Generation chatbot over a local document corpus, with embeddings stored in PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nejmeddine Ben Maatoug" }]
keywords = ["rag", "nlp", "postgresql", "embeddings", "llm", "chatbot"]

dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "langchain-text-splitters>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "ruff>=0.6"]
notebook = ["ipykernel>=6.29"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
